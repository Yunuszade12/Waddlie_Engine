[package]
name = "waddlie_core"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = {version = "0.18.1", default-features = true, features = [
    "bevy_winit",
    "bevy_render",
    "bevy_sprite", 
    "bevy_pbr",    
    "multi_threaded",
    "webgpu", 
]}

bevy_rapier3d = { version = "0.34.0", features = ["debug-render-3d"] }
serde = { version = "1.0", features = ["derive"] }
bevy_common_assets = { version = "0.13", features = ["json"] }
serde_json = "1.0.150"
rand = "0.8"

wasm-bindgen = "0.2"
console_error_panic_hook = "0.1.7"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 0

[package.metadata.wasm-pack.profile.release]
wasm-opt = false